<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes" />
    <link rel="canonical" href="https://developer.taptap.cn/" />
    <meta name="theme-color" content="#09092f" />
    <!-- Build version, injected from the release tag: `curl -s https://developer.taptap.cn/ | grep landing-version` -->
    <meta name="landing-version" content="__APP_VERSION__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TapTap 开发者服务" />
    <meta property="og:url" content="https://developer.taptap.cn/" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="TapTap 开发者服务" />
    <meta property="og:description" content="TapTap Developer Center，TapTap 开发者中心" />
    <meta name="description" content="TapTap Developer Center，TapTap 开发者中心" />
    <!-- A single preview image: a second `og:image` pair left it ambiguous which one a
         crawler would pick, and most of them only read the first. -->
    <meta property="og:image" content="__OG_IMAGE_WIDE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__OG_IMAGE_WIDE__" />
    <meta name="keywords" content="TapTap Developer Center,TapTap 开发者中心,开发者中心,游戏服务,创建游戏" />
    <link rel="icon" href="/favicon.ico" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TapTap 开发者服务",
        "alternateName": "TapTap Developer Center",
        "url": "https://developer.taptap.cn/",
        "description": "面向游戏开发者的游戏发行、上架与运营平台，支持传统发行轨与 PC / H5 / TapTap 制造等轻量上架轨，并提供 TapTap CLI。",
        "inLanguage": "zh-CN"
      }
    </script>
    <title>TapTap 开发者服务</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow-y: hidden;
        background-color: #f5f5f5;
      }

      .landing-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        font-size: 14px;
      }

      .sk-wrapper {
        position: relative;
        width: 4em;
        height: 4em;
      }

      .sk-wrapper .sk-sub {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
      }

      .sk-wrapper .sk-sub::before {
        content: '';
        display: block;
        margin: 0 auto;
        width: 15%;
        height: 15%;
        background-color: #b9bec1;
        border-radius: 100%;
        animation: sk-wrapper-delay 1.2s infinite ease-in-out both;
      }

      .sk-wrapper .sk-2 {
        transform: rotate(30deg);
      }
      .sk-wrapper .sk-2::before {
        animation-delay: -1.1s;
      }
      .sk-wrapper .sk-3 {
        transform: rotate(60deg);
      }
      .sk-wrapper .sk-3::before {
        animation-delay: -1s;
      }
      .sk-wrapper .sk-4 {
        transform: rotate(90deg);
      }
      .sk-wrapper .sk-4::before {
        animation-delay: -0.9s;
      }
      .sk-wrapper .sk-5 {
        transform: rotate(120deg);
      }
      .sk-wrapper .sk-5::before {
        animation-delay: -0.8s;
      }
      .sk-wrapper .sk-6 {
        transform: rotate(150deg);
      }
      .sk-wrapper .sk-6::before {
        animation-delay: -0.7s;
      }
      .sk-wrapper .sk-7 {
        transform: rotate(180deg);
      }
      .sk-wrapper .sk-7::before {
        animation-delay: -0.6s;
      }
      .sk-wrapper .sk-8 {
        transform: rotate(210deg);
      }
      .sk-wrapper .sk-8::before {
        animation-delay: -0.5s;
      }
      .sk-wrapper .sk-9 {
        transform: rotate(240deg);
      }
      .sk-wrapper .sk-9::before {
        animation-delay: -0.4s;
      }
      .sk-wrapper .sk-10 {
        transform: rotate(270deg);
      }
      .sk-wrapper .sk-10::before {
        animation-delay: -0.3s;
      }
      .sk-wrapper .sk-11 {
        transform: rotate(300deg);
      }
      .sk-wrapper .sk-11::before {
        animation-delay: -0.2s;
      }
      .sk-wrapper .sk-12 {
        transform: rotate(330deg);
      }
      .sk-wrapper .sk-12::before {
        animation-delay: -0.1s;
      }

      @keyframes sk-wrapper-delay {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
    </style>
  </head>

  <body class="develop-center">
    <noscript>
      <p style="padding: 16px; font-family: sans-serif">本页面需要启用 JavaScript 才能完整浏览。</p>
    </noscript>
    <div class="landing-loading">
      <div class="sk-wrapper">
        <i class="sk-sub sk-1"></i>
        <i class="sk-sub sk-2"></i>
        <i class="sk-sub sk-3"></i>
        <i class="sk-sub sk-4"></i>
        <i class="sk-sub sk-5"></i>
        <i class="sk-sub sk-6"></i>
        <i class="sk-sub sk-7"></i>
        <i class="sk-sub sk-8"></i>
        <i class="sk-sub sk-9"></i>
        <i class="sk-sub sk-10"></i>
        <i class="sk-sub sk-11"></i>
        <i class="sk-sub sk-12"></i>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
