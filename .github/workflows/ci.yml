name: CI

# Verification only — this workflow never touches deployment credentials,
# so pull requests from forks can run it end to end.
# Releases are produced by release.yml; publishing happens outside this repository.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Verification does not need a browser; prerendering only runs for releases
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tracking contract
        run: pnpm run check:tracking

      - name: Build
        run: pnpm run build

      - name: Audit dist
        run: pnpm run audit:dist

      # The contract with tds-dc: it uploads the artifact to one fixed CDN prefix, so every
      # static reference in index.html must already point there. Without this the mismatch
      # only shows up when tds-dc fetches the release.
      - name: Release-form build (CDN base contract)
        env:
          PUBLIC_BASE: //assets.tapimg.com/developer-center-homepage/current/
        run: |
          pnpm run build
          node scripts/audit-dist.mjs "--expect-base=$PUBLIC_BASE"
